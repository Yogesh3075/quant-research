[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime"
version = "1.0.0"
description = "HMM and rule-based regime rotation across NSE factor indices"
requires-python = ">=3.11"
# Reported results were produced on Python 3.14 with: hmmlearn 0.3.3, matplotlib 3.11.2,
# numpy 2.5.4, pandas 3.1.1, pyyaml 6.0.3, requests 2.34.2, scikit-learn 1.9.1, scipy 1.18.1.
dependencies = [
    "hmmlearn>=0.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# note.py renders results/research_note.md from one f-string template: its long lines are Markdown
# paragraphs, and wrapping them would change the generated note.
"src/regime/note.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["regime"]
