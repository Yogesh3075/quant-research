[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs"
version = "1.0.0"
description = "Pairs trading on the point-in-time Nifty 500: audit, rebuild and variants"
requires-python = ">=3.11"
# Reported results were produced on Python 3.14 with: numpy 2.5.4, pandas 3.1.1, pyarrow 26.0.1,
# scipy 1.18.1, statsmodels 0.15.0 (and yfinance 1.8.0 for the original data download).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
yahoo = ["yfinance>=0.2.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pairs"]
