[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optsell"
version = "1.0.0"
description = "Systematic Nifty option selling on NSE F&O data"
requires-python = ">=3.11"
# Reported results were produced on Python 3.14 with: matplotlib 3.11.2, numpy 2.5.4,
# pandas 3.1.1, pyarrow 26.0.1, pyyaml 6.0.3, requests 2.34.2, scipy 1.18.1, tabulate 0.10.0,
# yfinance 1.8.0.
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scipy>=1.11",
    "tabulate>=0.9",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["optsell"]
