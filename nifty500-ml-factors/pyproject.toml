[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlfactors"
version = "1.0.0"
description = "LightGBM vs a linear factor blend on the point-in-time Nifty 500"
requires-python = ">=3.11"
# Reported results were produced on Python 3.14 with: lightgbm 4.7.0, numpy 2.5.4, pandas 3.1.1,
# pyarrow 26.0.1, scipy 1.18.1, shap 0.54.1, statsmodels 0.15.0.
dependencies = [
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "scipy>=1.11",
    "shap>=0.44",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mlfactors"]
